<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NeuraEdge AI | Topic 13: Toggle Switch</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>NeuraEdge AI</h1><p>Dashboard Settings</p></header>
<section class="wrap">
  <div class="setting">
    <div><strong>AI Chatbot Auto-Reply</strong><p>Let the AI answer customers automatically.</p></div>
    <label class="switch"><input type="checkbox" id="autoReply"><span class="slider"></span></label>
  </div>
  <div class="setting">
    <div><strong>Dark Mode</strong><p>Switch the dashboard theme.</p></div>
    <label class="switch"><input type="checkbox" id="darkMode"><span class="slider"></span></label>
  </div>
  <div class="status">
    <p id="botStatus"></p>
    <p id="themeStatus"></p>
  </div>
</section>
<footer>&copy; 2026 NeuraEdge AI</footer>
<script src="script.js"></script>
</body></html>
