<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NeuraEdge AI | Topic 9: Form Validation</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>NeuraEdge AI</h1><p>Book a Free AI Demo</p></header>
<section class="wrap">
  <p id="successMsg" class="success" hidden>Thank you! Your demo request has been submitted successfully.</p>
  <form id="demoForm" novalidate>
    <fieldset><legend>Contact Details</legend>
      <div class="field"><label for="name">Full Name</label>
        <input type="text" id="name" required minlength="3" maxlength="40" pattern="[A-Za-z ]+" title="Name must contain only letters and spaces" placeholder="e.g. Priya Sharma">
        <span class="error"></span></div>
      <div class="field"><label for="email">Company Email</label>
        <input type="email" id="email" required placeholder="you@company.com"><span class="error"></span></div>
      <div class="field"><label for="phone">Mobile Number</label>
        <input type="text" id="phone" required pattern="[6-9][0-9]{9}" title="Enter a valid 10-digit mobile number" placeholder="10-digit number"><span class="error"></span></div>
    </fieldset>
    <fieldset><legend>Project Details</legend>
      <div class="field"><label for="service">AI Service</label>
        <select id="service" required>
          <option value="">-- Select a service --</option>
          <option>AI Chatbots</option><option>Computer Vision</option><option>Predictive Analytics</option>
        </select><span class="error"></span></div>
      <div class="field"><label for="budget">Budget (USD)</label>
        <input type="number" id="budget" required min="1000" max="1000000" placeholder="1000 - 1000000"><span class="error"></span></div>
      <div class="field"><label for="date">Preferred Demo Date</label>
        <input type="date" id="date" required><span class="error"></span></div>
      <div class="field"><label for="msg">Describe your requirement</label>
        <textarea id="msg" rows="4" required minlength="20" maxlength="300" placeholder="Minimum 20 characters"></textarea><span class="error"></span></div>
      <div class="field"><label><input type="checkbox" id="terms" required> I agree to the privacy policy</label><span class="error"></span></div>
    </fieldset>
    <button type="submit">Submit Request</button>
  </form>
</section>
<footer>&copy; 2026 NeuraEdge AI</footer>
<script src="script.js"></script>
</body></html>
