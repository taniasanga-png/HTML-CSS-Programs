<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>NeuraEdge AI | Topic 3: Consultation Form</title></head>
<body>
<h1>Request an AI Consultation</h1>
<form action="#" method="post" enctype="multipart/form-data">
  <fieldset><legend>Personal Details</legend>
    <p><label for="name">Full Name:</label>
      <input type="text" id="name" name="name" required minlength="3" maxlength="50" placeholder="Your name"></p>
    <p><label for="email">Email:</label>
      <input type="email" id="email" name="email" required></p>
    <p><label for="pwd">Password:</label>
      <input type="password" id="pwd" name="pwd" required minlength="8" pattern="(?=.*\d)(?=.*[A-Za-z]).{8,}" title="At least 8 characters with letters and numbers"></p>
    <p><label for="age">Team Size:</label>
      <input type="number" id="age" name="team" min="1" max="10000" value="1" required></p>
    <p><label for="date">Preferred Meeting Date:</label>
      <input type="date" id="date" name="date" required></p>
  </fieldset>
  <fieldset><legend>Project Details</legend>
    <p>Company Type:
      <label><input type="radio" name="ctype" value="startup" required> Startup</label>
      <label><input type="radio" name="ctype" value="sme"> SME</label>
      <label><input type="radio" name="ctype" value="enterprise"> Enterprise</label></p>
    <p>Interested In:
      <label><input type="checkbox" name="svc" value="chatbot"> Chatbots</label>
      <label><input type="checkbox" name="svc" value="vision"> Computer Vision</label>
      <label><input type="checkbox" name="svc" value="analytics"> Predictive Analytics</label></p>
    <p><label for="budget">Budget:</label>
      <select id="budget" name="budget" required>
        <option value="">-- Select --</option>
        <option>Below $5,000</option><option>$5,000 - $25,000</option><option>Above $25,000</option>
      </select></p>
    <p><label for="msg">Project Description:</label><br>
      <textarea id="msg" name="msg" rows="5" cols="50" maxlength="500" required></textarea></p>
    <p><label for="file">Upload Requirements (PDF):</label>
      <input type="file" id="file" name="file" accept=".pdf,.doc,.docx"></p>
    <p><label><input type="checkbox" required> I agree to the terms</label></p>
  </fieldset>
  <button type="submit">Submit</button>
  <button type="reset">Reset</button>
</form>
</body></html>
